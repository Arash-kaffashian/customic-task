services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build: .
    container_name: django_web
    command: >
      sh -c "
        python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    # include depends on to build celery before redis container
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_network

  celery:
    build: .
    container_name: celery_worker
    command: celery -A mytask worker -l info
    volumes:
      - .:/app
      - media_volume:/app/media
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - app_network

volumes:
  media_volume:
networks:
  app_network:
    driver: bridge
